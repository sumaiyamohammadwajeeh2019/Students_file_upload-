<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students File Upload</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f5f7fb}
header{background:#0f172a;color:#fff;padding:18px;text-align:center}
.container{max-width:1100px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
input,select,button{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #d1d5db;margin:6px 0 12px}
button{background:#0f172a;color:#fff;border:none;cursor:pointer;font-weight:600}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;font-size:13px}
</style></head><body>
<header><h1>Applied Physiology - Students File Upload</h1><p>Student uploads → Teacher sees from any device</p></header>
<div class="container">
<div class="card">
<h2>📤 Student Upload</h2>
<input id="sName" placeholder="Student Name">
<input id="sRoll" placeholder="Roll / ID">
<select id="sTask"><option value="">Select Task</option><option>Integrated Teaching - Blood</option><option>Integrated Teaching - CVS</option><option>Applied Physiology - Assignment 1</option><option>General Assignment</option></select>
<input type="file" id="fileInput"><button id="uploadBtn">Upload to Teacher</button><div id="status"></div>
</div>
<div class="card"><h2>👩‍🏫 Teacher View (Live)</h2><button id="refreshBtn">Refresh List</button>
<table><thead><tr><th>Time</th><th>Name</th><th>Roll</th><th>Task</th><th>File</th></tr></thead><tbody id="tbody"><tr><td colspan=5>Loading...</td></tr></tbody></table>
</div></div>
<script>
const SUPABASE_URL="https://wbcqhfjzbuonrqvxklia.supabase.co";
const SUPABASE_KEY="sb_publishable_wtZFGexua7kU3GEIVzBb2g_VUKMm9-G";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const sName=document.getElementById('sName'),sRoll=document.getElementById('sRoll'),sTask=document.getElementById('sTask'),fileInput=document.getElementById('fileInput'),statusEl=document.getElementById('status'),tbody=document.getElementById('tbody');
async function loadSubmissions(){
 tbody.innerHTML='<tr><td colspan=5>Loading...</td></tr>';
 const {data,error}=await supabaseClient.from('submissions').select('*').order('created_at',{ascending:false}).limit(100);
 if(error){tbody.innerHTML=`<tr><td colspan=5 style=color:red>${error.message}</td></tr>`;return;}
 if(!data.length){tbody.innerHTML='<tr><td colspan=5>No submissions yet</td></tr>';return;}
 tbody.innerHTML=data.map(r=>{const d=new Date(r.created_at).toLocaleString();return `<tr><td>${d}</td><td>${r.student_name}</td><td>${r.roll}</td><td>${r.task_title}</td><td><a href="${r.file_url}" target="_blank">${r.file_name}</a></td></tr>`;}).join('');
}
document.getElementById('uploadBtn').onclick=async()=>{
 const file=fileInput.files[0];if(!sName.value||!sRoll.value||!sTask.value)return alert('Fill name, roll, task');if(!file)return alert('Choose file');
 statusEl.innerHTML='Uploading...';document.getElementById('uploadBtn').disabled=true;
 try{const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=`${sRoll.value}_${Date.now()}_${safe}`;
 const {error:upErr}=await supabaseClient.storage.from('assignments').upload(path,file);if(upErr)throw upErr;
 const {data:urlData}=supabaseClient.storage.from('assignments').getPublicUrl(path);
 const {error:dbErr}=await supabaseClient.from('submissions').insert({student_name:sName.value,roll:sRoll.value,task_title:sTask.value,file_url:urlData.publicUrl,file_name:file.name});if(dbErr)throw dbErr;
 statusEl.innerHTML='✅ Uploaded! Teacher can now see it.';fileInput.value='';loadSubmissions();
 }catch(e){statusEl.innerHTML='Error: '+e.message;}finally{document.getElementById('uploadBtn').disabled=false;}
};
document.getElementById('refreshBtn').onclick=loadSubmissions;loadSubmissions();
</script></body></html>
</script>
</body>
</html>
